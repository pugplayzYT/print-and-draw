name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore public release signing key
        run: |
          base64 --decode .signing/print-and-draw-release.jks.b64 > "$RUNNER_TEMP/print-and-draw-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/print-and-draw-release.jks" >> "$GITHUB_ENV"

      - name: Build production signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ilkkeeatingburgers
          ANDROID_KEY_ALIAS: printanddraw
          ANDROID_KEY_PASSWORD: ilkkeeatingburgers
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: print-and-draw-production-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
