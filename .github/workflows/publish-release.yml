name: Publish APK Release

on:
  workflow_run:
    workflows: ["Build Android Release APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: print-and-draw-production-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare release APK
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          mv release/app-release.apk "release/print-and-draw-build-${BUILD_NUMBER}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RELEASE_TAG="build-${BUILD_NUMBER}"
          APK_PATH="release/print-and-draw-build-${BUILD_NUMBER}.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$BUILD_SHA" \
              --title "Print & Draw Build #${BUILD_NUMBER}" \
              --notes "Automated signed APK build from commit ${BUILD_SHA}." \
              --prerelease
          fi
